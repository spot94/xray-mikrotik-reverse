name: Build & publish image

# Builds the multi-arch container and pushes it to GitHub Container Registry.
# Image tags = the Xray-core version (from the Dockerfile's ARG XRAY_VERSION)
# plus `latest`. A "release" is simply: bump ARG XRAY_VERSION in the Dockerfile
# and push to main -> a new ghcr.io/<owner>/xray-mikrotik:<version> is published.

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - entrypoint.sh
      - .github/workflows/docker-publish.yml
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read Xray-core version from Dockerfile
        id: xray
        run: |
          v="$(awk -F= '/^ARG[[:space:]]+XRAY_VERSION=/{print $2; exit}' Dockerfile | tr -d '[:space:]')"
          [ -n "$v" ] || { echo "::error::XRAY_VERSION not found in Dockerfile"; exit 1; }
          echo "version=${v#v}" >> "$GITHUB_OUTPUT"   # strip leading v -> e.g. 26.6.27

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.xray.outputs.version }}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          # arm64 is the Mikrotik target; amd64 is handy for local testing.
          platforms: linux/arm64,linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
